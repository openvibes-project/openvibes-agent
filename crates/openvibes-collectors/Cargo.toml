[package]
name = "openvibes-collectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
openvibes-core = { path = "../openvibes-core" }
# Byte scans of audit records (board #106).
memchr.workspace = true
# Read-only access to the RPM database.
rusqlite.workspace = true

[features]
# Linux only: embed the eBPF exec program (`process_events::ebpf`). Building
# it needs the nightly in ebpf/openvibes-agent-ebpf/rust-toolchain.toml
# (with rust-src) and bpf-linker; other targets ignore the feature.
ebpf = ["dep:aya", "dep:aya-build"]

[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true, optional = true }

# Tests only: `BtfKind` (aya does not re-export it); the version aya uses.
[dev-dependencies]
# The protocol's fact catalog, read by the hardening collector's test.
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
aya-obj = { version = "0.3.0", default-features = false }

[build-dependencies]
aya-build = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Reviewed 0.39.6 (2026-09-23): no process spawning outside `Process::kill*`
# (Windows `taskkill.exe`), which clippy.toml bans; macOS `sysctl` is test-only.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
sysinfo.workspace = true

[lints]
workspace = true
