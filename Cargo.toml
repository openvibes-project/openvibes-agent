[workspace]
resolver = "3"
members = [
    "crates/openvibes-agent",
    "crates/openvibes-collectors",
    "crates/openvibes-core",
    "crates/openvibes-rules",
    "crates/openvibes-storage",
    "crates/openvibes-test",
    "crates/openvibes-testkit",
    "crates/openvibes-transport",
]
# The eBPF program builds for bpfel-unknown-none with its own nightly.
exclude = ["ebpf"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
# Already in the tree (nom, via rcgen); the audit reader's byte scans.
memchr = { version = "2.8.3", default-features = false, features = ["std"] }
cel = { version = "=0.15.0", default-features = false, features = ["parser_pratt"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider"] }
zeroize = "1.9.1"
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std", "process", "system", "net", "rand", "event"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
sha2 = { version = "0.11.1", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1.0.154"
# eBPF exec watcher (feature `ebpf` of openvibes-collectors, Linux only):
# aya loads the program, aya-build compiles it from build.rs.
aya = { version = "0.16.0", default-features = false }
aya-build = { version = "0.2.1", default-features = false }
sysinfo = { version = "=0.40.1", default-features = false, features = ["system"] }
# Agent log lines: stderr (systemd journal) or, as a Windows service, the
# Windows Event Log (winlog2) under the Service Control Manager.
log = { version = "0.4.35", default-features = false, features = ["std"] }
winlog2 = { version = "0.3.2", default-features = false }
windows-service = { version = "0.8.1", default-features = false }
# Windows programs and version from the registry (P22); already in the tree
# through winlog2.
winreg = { version = "0.55.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
