[workspace]
resolver = "3"
members = [
    "crates/openvibes-agent",
    "crates/openvibes-collectors",
    "crates/openvibes-core",
    "crates/openvibes-rules",
    "crates/openvibes-storage",
    "crates/openvibes-testkit",
    "crates/openvibes-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
cel = { version = "=0.14.5", default-features = false, features = ["parser_pratt"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider"] }
zeroize = "1.8"
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
sha2 = { version = "0.11", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.145"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
