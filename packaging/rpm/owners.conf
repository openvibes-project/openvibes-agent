# Opt-in: exact port owners for the OpenVIBES agent (decision B).
# Install as /etc/systemd/system/openvibes-agent.service.d/owners.conf, then
# run: systemctl daemon-reload && systemctl restart openvibes-agent
#
# RISK, read docs/components/packaging.md first: these two capabilities let
# the agent read every file on the host and attach to any process, root's
# included. If the agent were compromised, that is close to root. Without
# this file each port still shows its systemd service.
[Service]
AmbientCapabilities=CAP_DAC_READ_SEARCH CAP_SYS_PTRACE
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_SYS_PTRACE
