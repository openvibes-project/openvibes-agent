# OpenVIBES agent configuration; see docs/components/packaging.md.
# The agent refuses to start until platform_ca_file exists and the values
# below are edited for your platform.

state_dir = "/var/lib/openvibes-agent"

# Ingest service (default port 18423) and the platform root CA it trusts.
platform_url = "https://platform.example.com"
platform_ca_file = "/etc/openvibes-agent/platform-ca.crt"
# Enrollment token (owner openvibes_agent, mode 0600). Kept after enrollment:
# a fleet token lets the agent re-enroll after its certificate expires.
enrollment_token_file = "/etc/openvibes-agent/token"

# Distribution service (default port 18424): fetch rule bundles instead of
# provisioning bundle_file.
# distribution_url = "https://platform.example.com"

# Seconds between scans (60 to 86400, default 3600).
# scan_interval_seconds = 3600

# Host collectors (default when left out: processes, packages, ports,
# services). Rules over a disabled collector's facts report unavailable.
# process_events raises alarms from process starts (eBPF first, kernel
# audit as the fallback; on fallback hosts the package installs the audit
# rule, and the unit grants CAP_AUDIT_READ). process_events_source = "audit"
# (tests only) skips eBPF.
# Process starts come from the agent's own eBPF program when the kernel
# allows it (BTF and kernel 5.8 or later); then the package touches no audit
# rule. On other hosts (the audit fallback) installing or upgrading the
# package adds the agent's exec audit rule and comments out Fedora's
# `-a task,never` (which stops the kernel reporting any program start).
# Set this to false to keep your audit rules as they are on every host;
# /usr/libexec/openvibes-agent/audit-fallback sets the fallback up by hand.
# manage_audit_rules = true
# services sends the listening ports and systemd services to the platform;
# exact port owners come from
# the package's root-facts helper (openvibes-agent-facts.timer), on by default.
collectors = ["processes", "packages", "ports", "process_events", "services"]

# One block per rule set, with the keys trusted to sign it. With a
# distribution_url, bundle_file may be left out.
# [[rule_sets]]
# id = "baseline"
# bundle_file = "/etc/openvibes-agent/baseline.json"
# trusted_keys = [{ issuer_key_id = "org.rules", public_key = "BASE64URL_ED25519_PUBLIC_KEY" }]
