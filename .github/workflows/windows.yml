# Windows-only checks for code under cfg(not(unix)), which Linux development
# never compiles. The full CI matrix stays in .github/ci.yml.example.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Clippy and tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The protocol submodule is private; the default token cannot read it.
      # OPENVIBES is a fine-grained PAT, read-only on openvibes-protocol only.
      - name: Fetch protocol submodule
        shell: bash
        env:
          TOKEN: ${{ secrets.OPENVIBES }}
        run: >-
          git -c "url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/"
          submodule update --init

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -F unsafe-code

      - name: Tests
        run: cargo test --locked --workspace --all-features
