# Every action is pinned to a full commit SHA with its version in a comment.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Docs-only changes (every file *.md) skip the build and test jobs; code
  # changes run everything as before. Pushes to main work the same way, the
  # nightly-style full run is a manual dispatch. Skipped jobs count as passing
  # for required checks; the two matrix jobs (their names hold the matrix
  # value, which a skipped job never expands) still run and skip their steps.
  changes:
    name: Choose test tiers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.pick.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pick tiers
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          bash scripts/test-ci-docs.sh
          # A manual run, or a diff that cannot be made, lists nothing: everything runs.
          case "$EVENT" in
            pull_request) changed=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" 2>/dev/null || true) ;;
            push) changed=$(git diff --no-renames --name-only "$BEFORE_SHA" "$PUSH_SHA" 2>/dev/null || true) ;;
            *) changed= ;;
          esac
          bash scripts/ci-docs.sh <<<"$changed" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Format, clippy, docs, audit
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch protocol submodule
        run: git submodule update --init

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Feature `ebpf` (Linux only): the eBPF crate's nightly and bpf-linker.
      - name: eBPF build tools (nightly, bpf-linker)
        if: runner.os == 'Linux'
        run: bash scripts/ebpf-tools.sh

      - name: Format
        run: cargo fmt --all --check

      # The eBPF crate is outside the workspace. Format only: clippy needs
      # the clippy component on its nightly and -Z build-std for the BPF
      # target, and the eBPF program changes only with a lab load (R14).
      - name: Format (eBPF crate)
        run: cargo fmt --check --manifest-path ebpf/openvibes-agent-ebpf/Cargo.toml

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -F unsafe-code

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Install cargo-audit
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-audit@0.22.2

      - name: Audit dependencies (RustSec)
        run: cargo audit --deny warnings

  test:
    name: Clippy and tests (${{ matrix.check }})
    needs: [changes, lint]
    # Runs on docs-only changes too, with its steps skipped (see "changes").
    if: ${{ !cancelled() && (needs.changes.outputs.docs == 'true' || needs.lint.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        # `check` keeps the required check names; `os` is the pinned runner.
        include:
          - { check: ubuntu-latest, os: ubuntu-24.04 }
          - { check: windows-latest, os: windows-latest }
          - { check: macos-latest, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.docs != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch protocol submodule
        if: needs.changes.outputs.docs != 'true'
        shell: bash
        run: git submodule update --init

      - name: Install pinned toolchain from rust-toolchain.toml
        if: needs.changes.outputs.docs != 'true'
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        if: needs.changes.outputs.docs != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Feature `ebpf` (Linux only): the eBPF crate's nightly and bpf-linker.
      - name: eBPF build tools (nightly, bpf-linker)
        if: needs.changes.outputs.docs != 'true' && (runner.os == 'Linux')
        run: bash scripts/ebpf-tools.sh

      # Compiles cfg(windows) and cfg(target_os = "macos") code paths.
      - name: Clippy
        if: needs.changes.outputs.docs != 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -F unsafe-code

      - name: Tests
        if: needs.changes.outputs.docs != 'true'
        run: cargo test --locked --workspace --all-features

      # The agent under the real Service Control Manager (#117): it starts,
      # logs to the Event Log, and stops cleanly with exit code 0.
      # Windows PowerShell 5.1, for Get-EventLog.
      - name: Windows service start and stop
        if: needs.changes.outputs.docs != 'true' && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked -p openvibes-agent
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          $exe = (Resolve-Path target\debug\openvibes-agent.exe).Path
          $dir = Join-Path $env:RUNNER_TEMP 'ov-service'
          New-Item -ItemType Directory -Force $dir | Out-Null
          @"
          state_dir = '$dir\state'
          collectors = ["processes"]
          "@ | Set-Content -Encoding ascii "$dir\agent.toml"
          New-Service -Name openvibes-agent -BinaryPathName "`"$exe`" service `"$dir\agent.toml`"" | Out-Null
          Start-Service openvibes-agent
          $started = $null
          foreach ($i in 1..30) {
            $started = Get-EventLog -LogName Application -Newest 50 |
              Where-Object { $_.Source -eq 'openvibes-agent' -and $_.ReplacementStrings[0] -like '*started; collectors: *' }
            if ($started) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $started) { throw 'no "started" line in the Event Log' }
          Stop-Service openvibes-agent
          $service = Get-CimInstance Win32_Service -Filter "Name='openvibes-agent'"
          if ($service.State -ne 'Stopped' -or $service.ExitCode -ne 0) {
            throw "service ended as $($service.State), exit code $($service.ExitCode)"
          }
          # #125: Stop ends the service within seconds even with a request in
          # flight (a platform that accepts and never answers), so an MSI
          # upgrade never finds the exe locked and never needs a reboot.
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $cert = New-SelfSignedCertificate -DnsName 'localhost' -CertStoreLocation Cert:\CurrentUser\My
          "-----BEGIN CERTIFICATE-----`n" + [Convert]::ToBase64String($cert.RawData, 'InsertLineBreaks') + "`n-----END CERTIFICATE-----`n" |
            Set-Content -Encoding ascii "$dir\ca.crt"
          'test-token' | Set-Content -Encoding ascii "$dir\token"
          @"
          state_dir = '$dir\state'
          collectors = ["processes"]
          platform_url = 'https://127.0.0.1:$port'
          platform_ca_file = '$dir\ca.crt'
          enrollment_token_file = '$dir\token'
          "@ | Set-Content -Encoding ascii "$dir\agent.toml"
          $t = Get-Date
          Start-Service openvibes-agent
          Start-Sleep -Seconds 5
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          Stop-Service openvibes-agent
          $watch.Stop()
          $listener.Stop()
          $service = Get-CimInstance Win32_Service -Filter "Name='openvibes-agent'"
          if ($service.State -ne 'Stopped' -or $service.ExitCode -ne 0) {
            throw "stuck tick: service ended as $($service.State), exit code $($service.ExitCode)"
          }
          if ($watch.Elapsed.TotalSeconds -gt 20) { throw "stopping took $($watch.Elapsed.TotalSeconds) s" }
          $watchdog = Get-EventLog -LogName Application -Source openvibes-agent -After $t |
            Where-Object { $_.ReplacementStrings[0] -like '*still running*' }
          if (-not $watchdog) { throw 'the stop did not go through the watchdog (no tick in flight?)' }
          Write-Host "stopped in $([int]$watch.Elapsed.TotalSeconds) s with a request in flight"
          sc.exe delete openvibes-agent

  # #118: the Windows MSI. The release binary is built on Windows (MSVC),
  # the MSI on Linux with msitools (scripts/build-msi.sh), and the MSI is
  # installed, upgraded and uninstalled on Windows (scripts/test-msi.ps1).
  msi-exe:
    name: Windows MSI binary
    needs: [changes, lint]
    if: needs.changes.outputs.docs != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch protocol submodule
        shell: bash
        run: git submodule update --init

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Release binary
        run: cargo build --locked --release -p openvibes-agent --bin openvibes-agent

      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-exe
          path: target/release/openvibes-agent.exe
          retention-days: 3

  msi-build:
    name: Windows MSI package (msitools)
    needs: [msi-exe]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install msitools
        run: dnf -q -y install msitools

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe
          path: exe

      # 0.0.1: the "older" MSI the upgrade test starts from.
      - name: Build the MSIs
        run: |
          bash scripts/build-msi.sh exe/openvibes-agent.exe 0.0.1
          bash scripts/build-msi.sh exe/openvibes-agent.exe

      - name: Upload the MSIs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msi
          path: target/msi/*.msi
          retention-days: 3

  msi-test:
    name: Windows MSI (install, upgrade, uninstall)
    needs: [msi-build]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the MSIs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-msi
          path: msi

      - name: Install, upgrade and uninstall
        shell: powershell
        run: |
          $old = (Resolve-Path msi\openvibes-agent-0.0.1-x64.msi).Path
          $new = (Get-ChildItem msi\*.msi | Where-Object Name -ne 'openvibes-agent-0.0.1-x64.msi').FullName
          powershell -ExecutionPolicy Bypass -File scripts\test-msi.ps1 -Old $old -New $new
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # M6a: the Fedora RPM, built with Fedora's own toolchain, then tested
  # under a real systemd (podman, systemd as PID 1) on the runner.
  rpm:
    name: Fedora RPM (fedora:44)
    needs: [changes, lint]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install build packages
        run: dnf -q -y install git gcc cargo rust rpm-build rpm-sign gnupg2 systemd-rpm-macros

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The agent's default feature `ebpf`: nightly and bpf-linker beside
      # Fedora's cargo, which still builds the agent.
      - name: eBPF build tools (nightly, bpf-linker)
        run: BIN=/usr/local/bin bash scripts/ebpf-tools.sh

      - name: Package signing script
        run: bash scripts/test-sign-rpms.sh

      - name: Release script waits for CI
        run: bash scripts/test-release-wait-ci.sh

      - name: Unit capability and audit rule
        run: bash scripts/check-unit.sh

      - name: Build the RPM, a next-patch test build, and the signing tool
        shell: bash
        env:
          OV_RELEASE: 1.1.ci${{ github.run_number }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build-rpm.sh
          base=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          OV_VERSION=${base%.*}.$((${base##*.} + 1)) bash scripts/build-rpm.sh
          for rpm in target/rpm/RPMS/x86_64/openvibes-agent-*.rpm; do
            rpm -qp --qf '%{RELEASE}\n' "$rpm" | grep -Eq '^1\.1\.ci[0-9]+\.' ||
              { echo "$rpm: a CI build must not carry the published release"; exit 1; }
          done
          cargo build --release --locked -p openvibes-rules --example sign_bundle
          # One binary for the RPM, .deb and Arch packages: EL 9's glibc is the floor.
          bash scripts/test-check-glibc.sh
          bash scripts/check-glibc.sh target/release/openvibes-agent 2.34
          bash scripts/check-glibc.sh target/release/openvibes-test 2.34
          bash scripts/check-glibc.sh target/release/openvibes-agent-facts 2.34
          mkdir -p dist bin
          cp target/release/openvibes-agent target/release/openvibes-test target/release/openvibes-agent-facts bin/
          cp target/rpm/RPMS/x86_64/openvibes-agent-*.rpm target/release/examples/sign_bundle dist/

      - name: Upload RPMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-rpms
          path: dist/
          if-no-files-found: error

      # Its own artifact: other repositories' CI downloads agent-rpms.
      - name: Upload the binary (for the .deb and Arch packages)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-binary
          path: bin/
          if-no-files-found: error

  # The .deb and Arch packages wrap the RPM's binary (offline install spec,
  # openvibes-platform docs/specs/2026-10-09-offline-install-and-updates-design.md §4).
  deb:
    name: Debian package (debian:12)
    needs: [changes, rpm]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: debian:12
    steps:
      - name: Install build packages
        run: apt-get update -q && apt-get install -y -q git debhelper dpkg-dev lintian

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-binary
          path: bin

      - name: Build BASE and a next-patch test build
        env:
          OV_RELEASE: 1.1.ci${{ github.run_number }}
        run: |
          base=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          mkdir dist
          cp "$(bash scripts/build-deb.sh bin/openvibes-agent)" dist/
          cp "$(bash scripts/build-deb.sh bin/openvibes-agent "${base%.*}.$((${base##*.} + 1))")" dist/

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-debs
          path: dist/
          if-no-files-found: error

  arch:
    name: Arch package (archlinux:base-devel)
    needs: [changes, rpm]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: archlinux:base-devel
    steps:
      - name: Install build packages
        run: pacman -Syu --noconfirm --needed git namcap

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-binary
          path: bin

      - name: Build BASE and a next-patch test build
        env:
          OV_PKGREL: 1.${{ github.run_number }}
        run: |
          base=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          mkdir dist
          cp "$(bash scripts/build-arch.sh bin/openvibes-agent)" dist/
          cp "$(bash scripts/build-arch.sh bin/openvibes-agent "${base%.*}.$((${base##*.} + 1))")" dist/

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-arch
          path: dist/
          if-no-files-found: error

  # Each package format on the systems it serves, under a real systemd:
  # install, static checks, upgrade keeping an edited agent.toml, erase.
  packages:
    name: Install, upgrade, erase (${{ matrix.image }})
    needs: [changes, rpm, deb, arch]
    if: ${{ !cancelled() && (needs.changes.outputs.docs == 'true' || (needs.rpm.result == 'success' && needs.deb.result == 'success' && needs.arch.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "docker.io/library/debian:12", artifact: agent-debs }
          - { image: "docker.io/library/ubuntu:22.04", artifact: agent-debs }
          - { image: "docker.io/library/archlinux:latest", artifact: agent-arch }
          - { image: "docker.io/library/almalinux:9", artifact: agent-rpms }
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.docs != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        if: needs.changes.outputs.docs != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: pkgs

      - name: Install, upgrade, erase
        if: needs.changes.outputs.docs != 'true'
        run: bash scripts/pkg-test.sh "${{ matrix.image }}" pkgs

  systemd:
    name: RPM under systemd (install, sandbox, upgrade, downgrade, uninstall)
    needs: [changes, rpm]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-rpms
          path: dist

      - name: Systemd test
        run: |
          chmod +x dist/sign_bundle
          SIGN_BIN="$PWD/dist/sign_bundle" bash scripts/systemd-test.sh "$PWD/dist"

      - name: Audit rules (eBPF host, upgrade from 0.2.5, fallback, erase)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tests/packaging/audit-setup.sh
          mkdir old
          gh release download v0.2.5 -R "$GITHUB_REPOSITORY" -D old \
            -p 'openvibes-agent-0.2.5-1.fc44.x86_64.rpm' -p SHA256SUMS
          (cd old && sha256sum -c --ignore-missing SHA256SUMS)
          bash scripts/audit-rules-e2e.sh "$PWD/dist" old/openvibes-agent-0.2.5-1.fc44.x86_64.rpm

  # P14: threat alarms on a real kernel (the runner is a VM with sudo):
  # the capability drop with real capabilities; then the agent as nobody,
  # with the packaged audit rule and only CAP_AUDIT_READ, and with eBPF and
  # only CAP_BPF and CAP_PERFMON (no exec audit rule, auditd stopped); a
  # parent started before it, and a cost run.
  alarms-kernel:
    name: Alarms on a real kernel
    needs: [changes, lint]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch protocol submodule
        run: git submodule update --init

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: eBPF build tools (nightly, bpf-linker)
        run: bash scripts/ebpf-tools.sh

      - name: Install auditd
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q auditd jq libcap2-bin

      - name: Alarms end to end
        run: bash scripts/alarms-kernel-e2e.sh

  # P15: port owners on a real kernel (the runner is a VM with sudo), under
  # the packaged unit, unprivileged and through the packaged root-facts
  # helper, and the scan's CPU time.
  services-kernel:
    name: Host services on a real kernel
    needs: [changes, lint]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch protocol submodule
        run: git submodule update --init

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Host services end to end
        run: bash scripts/services-e2e.sh

  # P14 cost gate (board #86): the packaged binary under its unit on the VM
  # runner, idle / exec load / alarm storm, with alarms off (no platform) and on
  # (eBPF), and an exec load read from audit: eBPF's user CPU per 1,000
  # starts must not exceed audit's. The run fails unless the packaged unit
  # lets the agent load eBPF (bpf() allowed past ~@privileged).
  alarms-cost:
    name: Alarms cost (packaged binary)
    needs: [changes, rpm]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-rpms
          path: dist

      - name: Install auditd and rpm2cpio
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q auditd rpm2cpio cpio strace

      - name: Measure
        run: bash scripts/alarms-cost.sh dist
