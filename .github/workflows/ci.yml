# Every action is pinned to a full commit SHA with its version in a comment.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format, clippy, docs, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The protocol submodule is private; the default token cannot read it.
      # OPENVIBES is a fine-grained PAT, read-only on openvibes-protocol only.
      - name: Fetch protocol submodule
        env:
          TOKEN: ${{ secrets.OPENVIBES }}
        run: >-
          git -c "url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/"
          submodule update --init

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -F unsafe-code

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Install cargo-audit
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-audit@0.22.2

      - name: Audit dependencies (RustSec)
        run: cargo audit --deny warnings

  test:
    name: Clippy and tests (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch protocol submodule
        shell: bash
        env:
          TOKEN: ${{ secrets.OPENVIBES }}
        run: >-
          git -c "url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/"
          submodule update --init

      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Compiles cfg(windows) and cfg(target_os = "macos") code paths.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -F unsafe-code

      - name: Tests
        run: cargo test --locked --workspace --all-features
